name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SKIP_INSTALL_SIMPLE_GIT_HOOKS: 1

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run lint:fixtures
      - run: npm run lint:css
      - run: npm run format:check
      - run: npm run dup
      - run: npm run knip
      - run: npm run build
      - run: npm run size

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    env:
      # Pull requests run Chromium only; main runs every engine.
      BROWSERS: ${{ github.event_name == 'push' && 'chromium firefox webkit' || 'chromium' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: |
          read -ra browsers <<< "$BROWSERS"
          npx playwright install --with-deps "${browsers[@]}"
      - run: |
          read -ra browsers <<< "$BROWSERS"
          npx playwright test "${browsers[@]/#/--project=}"
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # PDF/UA-1 check of the Story 8.1 PDF spike. Main only: it adds a browser install and a Docker pull.
  verapdf:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      VERAPDF_IMAGE: verapdf/cli:v1.30.3@sha256:d565095c67a083e693aebf7d1a15784007370571053fc1aa5b502665b9a78f9c
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium tests/e2e/pdfSpike.spec.ts
      - name: Validate the sample PDF against PDF/UA-1
        run: |
          set +e
          docker run --rm -v "$PWD/test-results/pdf-spike:/data" "$VERAPDF_IMAGE" \
            --flavour ua1 --format mrr /data/sample-chromium.pdf > test-results/pdf-spike/verapdf-report.xml
          status=$?
          set -e
          grep -o '<validationReports [^>]*>' test-results/pdf-spike/verapdf-report.xml || true
          # veraPDF exits 0 only when every file is compliant; the summary also guards against a run that validated nothing.
          test "$status" -eq 0
          grep -q 'compliant="1" nonCompliant="0" failedJobs="0"' test-results/pdf-spike/verapdf-report.xml
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pdf-spike
          path: |
            test-results/pdf-spike
            playwright-report
          if-no-files-found: warn
          retention-days: 14
